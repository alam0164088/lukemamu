{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found (404)</title>
    <link rel="stylesheet" href="{% static 'css/404.css' %}">
</head>
<body>
    <main class="page-404">
        <div class="content">
            <div class="error-code">404</div>
            <h1>Sorry, the page was not found</h1>
            <p>The URL you're trying to access doesn't exist on our server or has been moved.</p>
            <div class="error-details">
                <p><strong>Request Path:</strong> {{ request.path }}</p>
            </div>
            <div class="action-buttons">
                <a href="/" class="btn btn-primary">Return to Home</a>
                <a href="/api/" class="btn btn-secondary">API Documentation</a>
            </div>
        </div>
    </main>
</body>
</html>
